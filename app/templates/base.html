<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ACS Content Production{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
    <nav class="bg-gray-900 border-b border-gray-800 px-6 py-3">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <h1 class="text-lg font-bold text-emerald-400">ACS Content Production</h1>
            <div class="flex gap-4 items-center text-sm">
                <a href="/" class="text-gray-300 hover:text-white">Dashboard</a>
                <span id="tiktok-status" class="px-2 py-1 rounded text-xs text-gray-400">TikTok: ...</span>
                <a href="/auth/tiktok/login" class="px-3 py-1 rounded text-xs bg-pink-700 hover:bg-pink-600 text-white font-medium" title="Hubungkan akun TikTok (OAuth)">
                    🔗 Hubungkan TikTok
                </a>
                <button
                    onclick="generateNow()"
                    class="bg-emerald-600 hover:bg-emerald-500 px-3 py-1 rounded text-white font-medium"
                >
                    Generate Now
                </button>
            </div>
        </div>
    </nav>
    <main class="max-w-7xl mx-auto px-6 py-6">
        <div id="flash" class="hidden mb-4 p-3 rounded text-sm"></div>
        {% block content %}{% endblock %}
    </main>
    <script>
        (function () {
            const params = new URLSearchParams(location.search);
            const flash = document.getElementById('flash');
            if (params.get('tiktok') === 'connected') {
                flash.textContent = '✅ TikTok berhasil dihubungkan! Token tersimpan.';
                flash.className = 'mb-4 p-3 rounded text-sm bg-emerald-900/50 border border-emerald-700 text-emerald-300';
                flash.classList.remove('hidden');
            } else if (params.get('tiktok') === 'notconfigured') {
                flash.textContent = '⚠️ Isi dahulu TIKTOK_CLIENT_KEY & TIKTOK_CLIENT_SECRET di file .env, lalu restart server.';
                flash.className = 'mb-4 p-3 rounded text-sm bg-yellow-900/50 border border-yellow-700 text-yellow-300';
                flash.classList.remove('hidden');
            }
        })();
        async function generateNow() {
            const btn = event.target;
            btn.disabled = true;
            btn.textContent = 'Generating...';
            try {
                const res = await fetch('/api/generate-now', { method: 'POST' });
                const data = await res.json();
                if (data.success) {
                    alert(`Generated ${data.count} konten baru!`);
                    location.reload();
                } else {
                    alert('Gagal generate: ' + data.error);
                }
            } catch(e) {
                alert('Error: ' + e.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Generate Now';
            }
        }

        async function updateStatus(id, status) {
            try {
                await fetch(`/api/contents/${id}`, {
                    method: 'PATCH',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({status})
                });
                location.reload();
            } catch(e) {
                alert('Error: ' + e.message);
            }
        }

        async function approveContent(id) {
            try {
                await fetch(`/api/contents/${id}/approve`, { method: 'POST' });
                location.reload();
            } catch(e) {
                alert('Error: ' + e.message);
            }
        }

        async function rejectContent(id) {
            try {
                await fetch(`/api/contents/${id}/reject`, { method: 'POST' });
                location.reload();
            } catch(e) {
                alert('Error: ' + e.message);
            }
        }

        async function publishTikTok(id) {
            if (!confirm('Upload konten ini ke TikTok?')) return;
            try {
                const res = await fetch(`/api/contents/${id}/publish`, { method: 'POST' });
                const data = await res.json();
                if (!res.ok) {
                    alert('Gagal: ' + (data.detail || 'unknown'));
                } else {
                    alert('Berhasil! Modus: ' + data.mode + (data.publish_id ? ' | ID: ' + data.publish_id : ''));
                }
                location.reload();
            } catch(e) {
                alert('Error: ' + e.message);
            }
        }

        async function refreshTikTokStatus() {
            const el = document.getElementById('tiktok-status');
            try {
                const res = await fetch('/auth/tiktok/status');
                const s = await res.json();
                if (!s.client_configured) {
                    el.textContent = 'TikTok: belum diatur (isi .env)';
                    el.className = 'px-2 py-1 rounded text-xs bg-red-900/50 text-red-300';
                } else if (s.has_access_token && !s.expired) {
                    el.textContent = 'TikTok: terhubung' + (s.open_id ? ' (' + s.open_id.slice(0,6) + '...)' : '');
                    el.className = 'px-2 py-1 rounded text-xs bg-emerald-900/50 text-emerald-300';
                } else if (s.has_access_token && s.expired) {
                    el.textContent = 'TikTok: token expired — refresh...';
                    el.className = 'px-2 py-1 rounded text-xs bg-yellow-900/50 text-yellow-300';
                    await fetch('/auth/tiktok/refresh', { method: 'POST' });
                    refreshTikTokStatus();
                } else {
                    el.textContent = 'TikTok: belum terhubung — klik Hubungkan';
                    el.className = 'px-2 py-1 rounded text-xs bg-yellow-900/50 text-yellow-300';
                }
            } catch(e) {
                el.textContent = 'TikTok: status gagal dimuat';
            }
        }
        refreshTikTokStatus();
    </script>
</body>
</html>
